<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Little Red Riding Hood — the wolf (local placeholder sprite) -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a97ad"/>
      <stop offset="1" stop-color="#5c6a80"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#9aa7ba"/>
    </linearGradient>
  </defs>

  <!-- bushy tail (white tip) -->
  <path d="M770 720 C 900 700, 960 560, 900 470 C 980 560, 960 720, 830 780 C 800 792, 780 760, 770 720 Z" fill="url(#fur)"/>
  <path d="M900 470 C 950 540, 940 640, 860 690 C 930 620, 920 520, 870 470 Z" fill="#eef2f6"/>

  <!-- back legs -->
  <path d="M560 740 L640 740 L650 950 L560 950 Z" fill="#4f5b6e"/>
  <path d="M690 740 L770 740 L780 950 L690 950 Z" fill="#4f5b6e"/>
  <!-- front legs -->
  <path d="M330 740 L410 740 L410 950 L320 950 Z" fill="url(#fur)"/>
  <path d="M440 750 L520 750 L520 950 L440 950 Z" fill="url(#fur)"/>
  <!-- paws -->
  <ellipse cx="365" cy="948" rx="60" ry="26" fill="#3d4655"/>
  <ellipse cx="480" cy="948" rx="55" ry="24" fill="#3d4655"/>
  <ellipse cx="605" cy="948" rx="55" ry="24" fill="#3d4655"/>
  <ellipse cx="735" cy="948" rx="58" ry="25" fill="#3d4655"/>

  <!-- body -->
  <path d="M300 560 C 280 460, 420 400, 560 430 C 720 460, 800 560, 780 700 C 770 780, 640 800, 520 780 C 400 760, 320 700, 300 560 Z" fill="url(#fur)"/>
  <!-- chest (lighter) -->
  <path d="M330 560 C 330 680, 400 760, 500 770 C 430 700, 400 620, 410 540 C 380 540, 350 545, 330 560 Z" fill="url(#furLight)"/>

  <!-- neck -->
  <path d="M430 470 C 420 380, 520 340, 600 360 C 660 375, 690 440, 660 500 C 590 520, 500 520, 430 470 Z" fill="url(#fur)"/>

  <!-- ears -->
  <path d="M470 300 L440 170 L560 250 Z" fill="url(#fur)"/>
  <path d="M486 285 L472 205 L545 250 Z" fill="#e8b7c0"/>
  <path d="M560 250 L610 150 L660 265 Z" fill="url(#fur)"/>
  <path d="M575 250 L605 185 L638 258 Z" fill="#e8b7c0"/>

  <!-- head -->
  <ellipse cx="560" cy="330" rx="150" ry="135" fill="url(#fur)"/>
  <!-- muzzle -->
  <path d="M470 360 C 470 440, 560 470, 640 440 C 700 420, 700 360, 660 330 C 610 300, 520 310, 470 360 Z" fill="url(#furLight)"/>
  <!-- nose -->
  <ellipse cx="600" cy="360" rx="34" ry="26" fill="#2b303a"/>
  <ellipse cx="590" cy="352" rx="9" ry="6" fill="#5a6373"/>
  <!-- mouth -->
  <path d="M600 386 C 600 410, 570 415, 545 405" fill="none" stroke="#2b303a" stroke-width="8" stroke-linecap="round"/>
  <!-- fangs -->
  <path d="M520 408 L540 408 L530 430 Z" fill="#ffffff"/>
  <path d="M555 407 L575 405 L566 428 Z" fill="#ffffff"/>
  <!-- eyes (amber) -->
  <ellipse cx="510" cy="300" rx="26" ry="30" fill="#f4c542"/>
  <ellipse cx="590" cy="298" rx="26" ry="30" fill="#f4c542"/>
  <ellipse cx="514" cy="303" rx="12" ry="15" fill="#1c1c1c"/>
  <ellipse cx="594" cy="301" rx="12" ry="15" fill="#1c1c1c"/>
  <circle cx="509" cy="297" r="4" fill="#ffffff"/>
  <circle cx="589" cy="295" r="4" fill="#ffffff"/>
  <!-- brow -->
  <path d="M485 272 L535 282" stroke="#4f5b6e" stroke-width="8" stroke-linecap="round"/>
  <path d="M615 280 L566 284" stroke="#4f5b6e" stroke-width="8" stroke-linecap="round"/>
</svg>
